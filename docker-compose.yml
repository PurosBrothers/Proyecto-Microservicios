services:
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    restart: on-failure

  eureka-server:
    build: ./eureka_server
    container_name: eureka-server
    ports:
      - "9989:9989"
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: on-failure

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  marketplace-ms:
    build: ./marketplace-ms
    container_name: marketplace-ms
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_USERNAME: postgres
      DB_PASSWORD: password
    ports:
      - "8084:8084"
    depends_on:
      - config-server
      - eureka-server
      - rabbitmq
      - postgres
    restart: on-failure

volumes:
  postgres_data:
