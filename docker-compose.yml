version: "3.9"

services:
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    restart: on-failure
    networks:
      my_network:
        ipv4_address: 172.25.0.2

  eureka-server:
    build: ./eureka_server
    container_name: eureka-server
    ports:
      - "9989:9989"
    restart: on-failure
    networks:
      my_network:
        ipv4_address: 172.25.0.3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: on-failure
    networks:
      my_network:
        ipv4_address: 172.25.0.4

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      my_network:
        ipv4_address: 172.25.0.5

  marketplace-ms:
    build: ./marketplace-ms
    container_name: marketplace-ms
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: postgres
      DB_PASSWORD: password
    ports:
      - "8084:8084"
    depends_on:
      - config-server
      - eureka-server
      - rabbitmq
      - postgres
    restart: on-failure
    networks:
      my_network:
        ipv4_address: 172.25.0.6

volumes:
  postgres_data:

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
