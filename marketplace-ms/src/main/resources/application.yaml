spring:
  application:
    name: marketplace-ms

  config:
    import: configserver:http://config-server:8888

  # Configuración de seguridad OAuth2 para Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          # URL del JWK Set de Keycloak - ajustar según configuración
          jwk-set-uri: http://keycloak:8080/realms/proyect-ms-realm/protocol/openid-connect/certs
          # Issuer URI de Keycloak
          issuer-uri: http://keycloak:8080/realms/proyect-ms-realm

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:9989/eureka/
