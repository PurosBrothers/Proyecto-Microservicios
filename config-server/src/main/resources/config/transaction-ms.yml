cloud:
  config:
    enabled: false
    import-check:
      enabled: false

datasource:
  url: jdbc:h2:file:./data/transactionDB;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
  driverClassName: org.h2.Driver
  username: farito
  password: 123

jpa:
  database-platform: org.hibernate.dialect.H2Dialect
  hibernate:
    ddl-auto: create-drop
  show-sql: true

h2:
  console:
    enabled: true
    path: /h2-console
    settings:
      web-allow-others: true
      trace: false

server:
  port: 8082

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9989/eureka/}
  instance:
    prefer-ip-address: true

## Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Microservicios de Transacciones
    description: Servicio para gestionar transacciones