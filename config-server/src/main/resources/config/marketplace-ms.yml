server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/marketplace_db
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/proyect-ms-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:9989/eureka/
  instance:
    prefer-ip-address: true
    hostname: marketplace-ms

rabbitmq:
  host: rabbitmq
  port: 5672
  username: guest
  password: guest
