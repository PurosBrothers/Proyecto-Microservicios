server:
  port: 8083

spring:
  application:
    name: user-ms
  cloud:
    config:
      enabled: true
  datasource:
    url: jdbc:postgresql://postgres:5432/user_ms_db
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/proyect-ms-realm

# Configuración de Keycloak Admin
keycloak:
  auth-server-url: http://keycloak:8080
  realm: proyect-ms-realm
  admin:
    username: admin
    password: admin123
    client-id: admin-cli
  client:
    id: user-ms-client
    secret: Aq3vK9EfTGwoWpK3j48RkN6Q0yCUZqGd

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:9989/eureka/
  instance:
    prefer-ip-address: true
    hostname: user-ms