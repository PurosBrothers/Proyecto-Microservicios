server:
  port: 8085

spring:
  application:
    name: payment-ms
  cloud:
    config:
      enabled: true
  datasource:
    url: jdbc:postgresql://postgres:5432/marketplace_db
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  graphql:
    graphiql:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:9989/eureka/
  instance:
    prefer-ip-address: true
    hostname: payment-ms

rabbitmq:
  host: rabbitmq
  port: 5672
  username: guest
  password: guest
